name: Test a binding

on:
  workflow_call:
    inputs:
      binding:
        required: true
        type: string
      runner:
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 40
    concurrency:
      group: cfgy-${{ inputs.binding }}-${{ inputs.runner }}-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-dotnet@v4
        if: inputs.binding == 'csharp'
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-go@v5
        if: inputs.binding == 'go'
        with:
          go-version: stable
          cache: false

      - uses: actions/setup-java@v4
        if: inputs.binding == 'java'
        with:
          distribution: temurin
          java-version: '21'

      - uses: julia-actions/setup-julia@v2
        if: inputs.binding == 'julia'
        with:
          version: '1.10'

      - name: Install Lua on Linux
        if: runner.os == 'Linux' && inputs.binding == 'lua'
        run: sudo apt-get update && sudo apt-get install -y lua5.4 liblua5.4-dev

      - name: Install GNU Octave on Linux
        if: runner.os == 'Linux' && inputs.binding == 'octave'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends octave liboctave-dev

      - name: Install Lua on macOS
        if: runner.os == 'macOS' && inputs.binding == 'lua'
        run: |
          brew install lua@5.4
          echo "$(brew --prefix lua@5.4)/bin" >> "$GITHUB_PATH"
          echo "LUA_DIR=$(brew --prefix lua@5.4)" >> "$GITHUB_ENV"

      - name: Install GNU Octave on macOS
        if: runner.os == 'macOS' && inputs.binding == 'octave'
        run: brew install octave

      - name: Install Windows GNU toolchain for cgo, Lua or GNU Octave
        if: runner.os == 'Windows' && contains(fromJSON('["go","lua","octave"]'), inputs.binding)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja
            ${{ inputs.binding == 'lua' && 'mingw-w64-ucrt-x86_64-lua54' || '' }}
            ${{ inputs.binding == 'octave' && 'mingw-w64-ucrt-x86_64-octave' || '' }}

      - name: Select Windows GNU tools
        if: runner.os == 'Windows' && contains(fromJSON('["go","lua","octave"]'), inputs.binding)
        shell: msys2 {0}
        run: |
          cygpath -w /ucrt64/bin >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$(cygpath -m /ucrt64)" >> "$GITHUB_ENV"

      - name: Build and run conformance tests
        env:
          BINDING: ${{ inputs.binding }}
          PYTHONUTF8: '1'
        shell: bash
        run: python .github/ci/test_binding.py "$BINDING"
